services:
  db:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa
      POSTGRES_DB: alfa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa"]
      interval: 3s
      retries: 20
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://alfa:alfa@db:5432/alfa?schema=public
      SESSION_SECRET: alfa-hack-secret-change-me-0123456789abcdef
      # YANDEX_API_KEY: ""
      # YANDEX_FOLDER_ID: ""
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: